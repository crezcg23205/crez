<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin Panel — CREZ Motion</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .admin-section {
      padding: 120px var(--side-pad) 60px;
      min-height: 100vh;
    }
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    .panel {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: var(--radius);
    }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-secondary); }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); border-radius: 4px;
    }
    .list-item {
      padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
    }
    .list-item:last-child { border-bottom: none; }
    .btn-small { padding: 6px 12px; font-size: 13px; }
  </style>
</head>
<body>
  <nav class="nav" id="nav">
    <a href="index.html#top" class="nav-logo">Admin Panel</a>
    <div class="nav-links">
      <a href="courses.html" class="nav-link">Saytga qaytish</a>
    </div>
    <div>
      <button class="btn btn--outlined" onclick="logout()">Chiqish</button>
    </div>
  </nav>

  <section class="admin-section">
    <div class="admin-grid">
      <!-- Add Course -->
      <div class="panel">
        <h3>Yangi kurs qo'shish</h3>
        <form onsubmit="addCourse(event)" style="margin-top: 20px;">
          <div class="form-group">
            <label>Kurs nomi</label>
            <input type="text" id="cTitle" required placeholder="Masalan: Al fiqh al akbar">
          </div>
          <div class="form-group">
            <label>Ta'rifi (Opisaniya / Afzalliklari)</label>
            <textarea id="cDesc" required rows="3"></textarea>
          </div>
          <div class="form-group">
            <label>Davomiyligi (oy)</label>
            <input type="number" id="cDuration" required>
          </div>
          <div class="form-group">
            <label>Narxi (so'm)</label>
            <input type="number" id="cPrice" required>
          </div>
          <button type="submit" class="btn btn--filled" style="width: 100%">Qo'shish</button>
        </form>
      </div>

      <!-- Students List -->
      <div class="panel">
        <h3>O'quvchilar ro'yxati</h3>
        <div id="studentsList" style="margin-top: 20px;">
          Yuklanmoqda...
        </div>
      </div>
    </div>
  </section>

  <script>
    window.onload = () => {
      if (localStorage.getItem('theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
      }
      
      if (localStorage.getItem('userRole') !== 'ADMIN') {
        alert("Sizda admin huquqi yo'q!");
        window.location.href = 'index.html';
        return;
      }

      loadStudents();
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userRole');
      window.location.href = 'login.html';
    }

    async function addCourse(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('cTitle').value,
        description: document.getElementById('cDesc').value,
        duration: parseInt(document.getElementById('cDuration').value),
        price: parseInt(document.getElementById('cPrice').value)
      };

      try {
        const res = await fetch('http://localhost:3000/courses', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          alert("Kurs muvaffaqiyatli qo'shildi!");
          e.target.reset();
        } else {
          alert("Xatolik yuz berdi");
        }
      } catch (err) {
        alert("Server xatosi");
      }
    }

    async function loadStudents() {
      try {
        const res = await fetch('http://localhost:3000/admin/students', {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        const students = await res.json();
        const list = document.getElementById('studentsList');
        
        if (students.length === 0) {
          list.innerHTML = '<p>O\'quvchilar yo\'q.</p>';
          return;
        }

        list.innerHTML = students.map(s => `
          <div class="list-item">
            <div>
              <strong>${s.firstName} ${s.lastName}</strong><br>
              <span style="font-size: 13px; color: var(--text-muted)">Kurs: ${s.courseName} | To'lov: ${s.paid ? 'Qilingan' : 'Kutilmoqda'}</span>
            </div>
            <button class="btn btn--outlined btn-small" onclick="sendCertificate(${s.userId}, ${s.courseId})">Sertifikat yuborish</button>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('studentsList').innerHTML = '<p>Ma\'lumotlarni yuklab bo\'lmadi.</p>';
      }
    }

    async function sendCertificate(userId, courseId) {
      if(!confirm("Haqiqatan ham sertifikat yubormoqchimisiz?")) return;
      try {
        const res = await fetch('http://localhost:3000/admin/certificate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          },
          body: JSON.stringify({ userId, courseId })
        });
        if (res.ok) {
          alert("Sertifikat o'quvchiga muvaffaqiyatli yuborildi!");
        } else {
          alert("Sertifikat yuborishda xatolik");
        }
      } catch (e) {
        alert("Server xatosi");
      }
    }
  </script>
</body>
</html>
