<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login / Register — CREZ Motion</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .auth-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px var(--side-pad) 60px;
    }
    .auth-container {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 40px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
    }
    .auth-title {
      font-family: var(--font-primary);
      font-size: 28px;
      margin-bottom: 24px;
      text-align: center;
    }
    .auth-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .auth-toggle button {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      cursor: pointer;
      border-radius: 4px;
    }
    .auth-toggle button.active {
      background: var(--text);
      color: var(--bg);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      border-radius: 4px;
    }
    .btn-submit {
      width: 100%;
      margin-top: 10px;
    }
    .error-msg {
      color: #ff4444;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <nav class="nav" id="nav">
    <a href="index.html#top" class="nav-logo">crez motion</a>
    <div class="nav-links">
      <a href="index.html#work" class="nav-link">Portfolio</a>
      <a href="courses.html" class="nav-link">Courses</a>
    </div>
  </nav>

  <section class="auth-section">
    <div class="auth-container">
      <div class="auth-toggle">
        <button id="toggleLogin" class="active" onclick="switchTab('login')">Login</button>
        <button id="toggleRegister" onclick="switchTab('register')">Register</button>
      </div>

      <h2 class="auth-title" id="formTitle">Tizimga kirish</h2>

      <form id="authForm" onsubmit="handleAuth(event)">
        <!-- Register only fields -->
        <div id="registerFields" style="display: none;">
          <div class="form-group">
            <label>Ism</label>
            <input type="text" id="firstName" placeholder="Ismingiz">
          </div>
          <div class="form-group">
            <label>Familiya</label>
            <input type="text" id="lastName" placeholder="Familiyangiz">
          </div>
        </div>

        <div class="form-group">
          <label>Login (Username)</label>
          <input type="text" id="username" required placeholder="Loginingizni kiriting">
        </div>
        <div class="form-group">
          <label>Parol</label>
          <input type="password" id="password" required placeholder="Parolni kiriting">
        </div>

        <button type="submit" class="btn btn--filled btn-submit" id="submitBtn">Kirish</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>
  </section>

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.setAttribute('data-theme', 'dark');
    }

    let isLogin = true;

    function switchTab(mode) {
      isLogin = mode === 'login';
      document.getElementById('toggleLogin').classList.toggle('active', isLogin);
      document.getElementById('toggleRegister').classList.toggle('active', !isLogin);
      document.getElementById('registerFields').style.display = isLogin ? 'none' : 'block';
      
      document.getElementById('formTitle').innerText = isLogin ? 'Tizimga kirish' : 'Ro\'yxatdan o\'tish';
      document.getElementById('submitBtn').innerText = isLogin ? 'Kirish' : 'Ro\'yxatdan o\'tish';
      document.getElementById('errorMsg').style.display = 'none';
      
      if (!isLogin) {
        document.getElementById('firstName').required = true;
        document.getElementById('lastName').required = true;
      } else {
        document.getElementById('firstName').required = false;
        document.getElementById('lastName').required = false;
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      const payload = { username, password };
      let endpoint = 'http://localhost:3000/auth/login';

      if (!isLogin) {
        payload.firstName = document.getElementById('firstName').value;
        payload.lastName = document.getElementById('lastName').value;
        endpoint = 'http://localhost:3000/auth/register';
      }

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('userRole', data.role);
          
          if (data.role === 'ADMIN') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'courses.html';
          }
        } else {
          showError(data.message || 'Xatolik yuz berdi');
        }
      } catch (err) {
        showError('Server bilan bog\'lanib bo\'lmadi');
      }
    }

    function showError(msg) {
      const errEl = document.getElementById('errorMsg');
      errEl.innerText = msg;
      errEl.style.display = 'block';
    }
  </script>
</body>
</html>
